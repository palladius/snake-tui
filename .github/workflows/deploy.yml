name: 🚀 Test & Deploy SnakeTUI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: 🧪 Minitest & Prepare Static Artifact
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 💎 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: 🔍 Run Minitest TDD Suite
        run: ruby test/test_snake_tui.rb

      - name: 📦 Assemble GitHub Pages Site
        run: |
          mkdir -p _site/lib/snake_tui _site/web
          cp web/index.html _site/index.html
          cp web/index.html _site/web/index.html
          cp lib/snake_tui/*.rb _site/lib/snake_tui/
          touch _site/.nojekyll

      - name: 📄 Setup Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: 🌐 Deploy to GitHub Pages
    needs: test-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
